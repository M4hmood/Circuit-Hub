version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: circuithub-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: circuithub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - circuithub-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: circuithub-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5000:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - circuithub-network
    depends_on:
      postgres:
        condition: service_healthy


volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  circuithub-network:
    driver: bridge

